{title:'Basic Factors in Ecological Classification',desc:'Foundational ideas used to describe and compare ecological conditions.',icon:'🌦',status:'Outline topic'},
{title:'Major Ecological Zones in West Africa and Nigeria',desc:'Ecological zones and the agricultural activities associated with them.',icon:'🗺',status:'Outline topic'},
{title:'Ecological Crop Distribution',desc:'How ecological conditions relate to where crops are grown.',icon:'🌾',status:'Outline topic'},
{title:'Ecological Factors of Crop Production',desc:'Environmental factors that shape crop establishment, growth and yield.',icon:'☀️',status:'Outline topic'},
{title:'Plant Interference',desc:'Plant interactions in ecological communities and their consequences for crop production.',icon:'🌿',status:'Lesson ready'},
{title:'Population Growth and Regulation',desc:'Population-level patterns and the processes that regulate them.',icon:'📈',status:'Outline topic'},
{title:'Evolution Strategies in Plants',desc:'Plant strategies and responses considered within ecological settings.',icon:'🧬',status:'Outline topic'},

const questions=[
{q:'An interaction between individuals of the same plant species is called:',opts:['Inter-specific interaction','Intra-specific interaction','Amensalism','Parasitism'],a:1,why:'Intra-specific interactions occur between individuals of the same species.'},
{q:'In competition for limited resources, the effect on both interacting plants is generally:',opts:['Positive','Mutually negative','Neutral','Positive for both, always'],a:1,why:'Competition is described as a mutually negative interaction in which plants require limited resources.'},
{q:'Which example illustrates a nurse-plant effect described in the course note?',opts:['Plantain shading and maintaining soil-surface moisture for emerging cocoa seedlings','Striga taking water and minerals from cereal roots','A weed reducing crop access to light','Mistletoe obtaining water from a tree'],a:0,why:'Plantain may shade and help maintain soil-surface moisture for emerging cocoa seedlings.'},
{q:'A crop cultivar’s ability to reduce weed growth, seed production and seedling establishment is its:',opts:['Weed tolerance','Weed suppression ability','Ecological dominance','Allelochemical persistence'],a:1,why:'The note defines weed suppression ability in these terms.'},
{q:'Which statement distinguishes weed tolerance from weed suppression?',opts:['Tolerance reduces weed seed production; suppression maintains crop yield','Tolerance maintains crop yield under weed pressure; suppression reduces weed growth and establishment','They mean exactly the same thing','Suppression only refers to crop emergence time'],a:1,why:'Tolerance is the ability to maintain yield when weeds are present; suppression reduces weed growth, seed production and seedling establishment.'},
{q:'Allelopathy is presented in the outline as a form of:',opts:['Competition','Parasitism','Amensalism','Mutualism'],a:2,why:'The note describes allelopathy as a form of amensalism involving chemical compounds.'},
{q:'A haustorium helps a parasitic plant to:',opts:['Fix atmospheric nitrogen','Penetrate host tissue and access conducting tissues','Produce pollen','Prevent seed germination'],a:1,why:'Haustoria penetrate host tissues and tap water- and food-conducting tissues.'},
{q:'Witchweed (Striga) seeds may use host-plant chemicals as signals to:',opts:['Induce seed germination','Increase crop leaf area','Form nodules','Complete pollination'],a:0,why:'The note states that chemicals from the host can signal Striga seeds to germinate and attach.'},
{q:'Which crop trait can contribute to competitive ability against weeds?',opts:['Early vigour','Delayed emergence','Reduced leaf area in all cases','Shallow roots in every environment'],a:0,why:'Early vigour is among the morphological factors listed as influencing crop competitive ability.'},
{q:'Competition for light is often asymmetric because:',opts:['Only the smaller plant can shade the larger one','A larger plant can shade and suppress a smaller neighbour','Both plants always receive equal light','Light is not a limited resource'],a:1,why:'Light competition is often asymmetric when one plant is large enough to shade another.'}

function coursePage(){return `${head()}<div class="card" style="margin-bottom:15px"><h3 class="card-title">CSP316 course outline</h3><div class="card-sub">Ten topics from the supplied course outline. Plant Interference includes the detailed teaching note provided.</div></div><div class="modules">${topics.map((m,i)=>moduleCard(m,i)).join('')}</div><div class="notice">“Outline topic” means the topic is included in the source outline, but a full lesson pack was not part of the supplied document.</div>`}
function modulePage(){const m=topics[selected];return `${head()}<div class="title-row"><button class="back" onclick="setView('course')">← All modules</button><span class="state ${selected===4?'ready':''}">${selected===4?'Lesson ready':'Outline topic'}</span></div><h2 class="topic-title">${m.icon} ${esc(m.title)}</h2><div class="topic-desc">${esc(m.desc)}</div><div class="tabs"><button class="tab ${tab==='lesson'?'active':''}" onclick="setTab('lesson')">Lesson</button><button class="tab ${tab==='activity'?'active':''}" onclick="setTab('activity')">Class activity</button><button class="tab ${tab==='quiz'?'active':''}" onclick="setTab('quiz')">Knowledge check</button></div>${selected===4?plantTab():outlineTab(m)}<div style="margin-top:15px;display:flex;justify-content:flex-end"><button class="btn btn-green" onclick="completeModule(${selected})">${progress.completed.includes(selected)?'✓ Completed':'Mark module complete'}</button></div>`}
function plantTab(){if(tab==='quiz')return quizPage();if(tab==='activity')return `<section class="card prose"><h3>Class activity</h3><p>Use the concepts in this lesson to discuss the following situations. Give a reason for each answer.</p><ol><li>Explain plant interactions that may occur in mixed cropping and intercropping systems.</li><li>If a crop exhibits allelopathy, what positive and negative effects could occur in crop production?</li><li>Name two cropping systems in which a nurse plant may be useful, and explain its role.</li></ol><div class="callout"><b>Think like an ecologist</b>For each example, identify the interacting organisms, the resource or process involved, and whether each plant benefits, is harmed, or is unaffected.</div><textarea id="activityAnswer" placeholder="Draft your notes here. They stay in this browser only." style="width:100%;min-height:105px;border:1px solid var(--line);border-radius:9px;padding:12px;resize:vertical"></textarea><button class="btn btn-green" style="margin-top:10px" onclick="toast('Your reflection is saved in this browser preview.')">Save reflection</button></section>`;return `<div class="lesson-layout"><article class="card prose"><h3>Plant interactions in ecological communities</h3><p>Plant interference encompasses interactions among plants growing close together in an ecological community. Communities contain populations of at least two species that interact directly or indirectly within a defined geographic area. These interactions help explain agronomic practices such as plant density, thinning, weed control, pest control and cropping systems.</p><p>Interactions may be <b>intra-specific</b> (between individuals of the same species) or <b>inter-specific</b> (between different species). Their effects may be positive, negative or neutral for each individual plant.</p><div class="callout"><b>A positive interaction: nurse plants</b>A nurse plant can improve local microclimate or resource conditions for a neighbour. In the supplied example, plantain shades the soil and helps maintain surface moisture for emerging cocoa seedlings.</div><h3>Negative plant interactions</h3><p>The teaching note covers three types: competition, amensalism and parasitism.</p><h3>1. Competition</h3><p>Competition occurs when plants require limited resources such as light, space, water or nutrients. Depletion of a shared resource can reduce the survival, growth or reproduction of the interacting plants. Competition may be intra-specific or inter-specific. In crop production, examples include crop-crop and crop-weed competition.</p><p>Competition can be <b>asymmetric</b>, when a larger plant takes a disproportionate share of a resource and suppresses a smaller neighbour, or more <b>symmetric</b>, when effects are proportionate to plant size. Light competition is often asymmetric because a taller plant can shade another. The note describes soil nutrient competition as usually symmetric soon after germination.</p><h3>Crop-weed competition and crop traits</h3><p>Relative emergence time can influence the outcome: a crop that emerges before weeds may capture more resources and gain an advantage. Crop characteristics linked to competitive ability include early vigour, growth rate, biomass, leaf area, leaf angle, crop density and cereal tillering capacity.</p><p>A cultivar's <b>weed suppression ability</b> is its capacity to reduce weed growth, seed production and seedling establishment. Its <b>weed tolerance</b> is its capacity to maintain yield when weeds are present. Bushy cassava and cover crops such as sweet potato and melon are examples mentioned in the note.</p><h3>2. Amensalism and allelopathy</h3><p>Amensalism describes an interaction in which one plant is unaffected while the other is harmed. <b>Allelopathy</b> is a form of amensalism involving chemical compounds released by a plant that affect another plant. Allelochemicals may directly affect germination, growth or survival, or may first be transformed by microorganisms. Effects can vary with genotype, environment, plant growth stage and microbial activity in the soil.</p><h3>3. Parasitism</h3><p>Parasitic plants harm a host. <b>Haustoria</b> penetrate host tissues and access conducting tissues. The supplied note describes mistletoe as partially parasitic: it photosynthesizes but obtains water from its host, including tree crops such as cocoa, kola and citrus. <b>Striga</b> is an obligate parasitic weed of tropical cereals and legumes; host-root chemicals can trigger seed germination before the parasite attaches and draws water, minerals and hormones.</p><div class="callout"><b>Apply the idea</b>When studying a crop association, ask: Which plants interact? What resource or chemical signal is involved? Is the effect positive, negative or neutral for each plant?</div></article><aside class="card sidecard"><h4>In this lesson</h4><div class="side-item"><span class="bullet">1</span><span>Plant interactions and ecological communities</span></div><div class="side-item"><span class="bullet">2</span><span>Competition and crop-weed relationships</span></div><div class="side-item"><span class="bullet">3</span><span>Amensalism and allelopathy</span></div><div class="side-item"><span class="bullet">4</span><span>Parasitism: mistletoe and Striga</span></div><div class="side-item"><span class="bullet">5</span><span>Class activity and knowledge check</span></div><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><h4>Study tip</h4><p style="font-size:10px;color:var(--muted);line-height:1.65">For every example, name the interaction and explain the effect on each plant.</p><button class="btn btn-green" style="width:100%" onclick="setTab('quiz')">Take knowledge check</button></aside></div>`}
function outlineTab(m){if(tab==='quiz')return `<div class="card"><div class="empty"><b>Knowledge check not added yet</b>A question set for “${esc(m.title)}” can be prepared when the lecture notes or teaching materials for this topic are available.</div></div>`;if(tab==='activity')return `<div class="card"><div class="empty"><b>Class activity to be developed</b>The supplied file provides a detailed class activity for Plant Interference. Activities for this topic can be added with its lecture materials.</div></div>`;return `<div class="card"><div class="empty"><b>Topic included in the CSP316 outline</b><p>This course outline names “${esc(m.title)}” but does not include a teaching note for it. The portal reserves this module for lecture notes, slides, examples, class activities and a quiz once those materials are provided.</p><p>For now, use the Course modules page to review the full sequence and open the Plant Interference lesson, which is supported by the attached teaching note.</p></div><div class="outline-list" style="margin-top:15px"><div class="outline-row"><span class="num">${String(selected+1).padStart(2,'0')}</span><div><b>${esc(m.title)}</b><small>Source: CSP316 course outline</small></div></div></div></div>`}
function quizPage(){return `<div class="card"><h3 class="card-title">Plant Interference · Knowledge check</h3><div class="card-sub">10 questions · Choose one answer for each. Explanations are shown after submission.</div><form id="quizForm">${questions.map((x,i)=>`<div class="question"><b>${i+1}. ${esc(x.q)}</b>${x.opts.map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}"><span>${esc(o)}</span></label>`).join('')}</div>`).join('')}<button type="submit" class="btn btn-green" style="margin-top:12px">Submit answers</button></form><div id="quizFeedback"></div></div>`}
function progressPage(){return `${head()}<section class="card"><h3 class="card-title">Your course progress</h3><div class="card-sub">This preview records completed modules and the Plant Interference quiz score in this browser.</div><div style="display:flex;align-items:center;gap:20px;margin:22px 0"><div style="font:800 34px Manrope;color:var(--green)">${progress.completed.length}/10</div><div style="flex:1"><b style="font-size:12px">Modules completed</b><div class="progress"><span style="width:${progress.completed.length*10}%"></span></div><small style="display:block;color:#8c9890;margin-top:7px">${progress.completed.length*10}% of the course</small></div></div><div class="outline-list">${topics.map((m,i)=>`<div class="outline-row"><span class="num">${progress.completed.includes(i)?'✓':String(i+1).padStart(2,'0')}</span><div style="flex:1"><b>${esc(m.title)}</b><small>${progress.completed.includes(i)?'Completed':i===4?'Lesson available':'Outline topic · lesson pack to be added'}</small></div><span class="state ${i===4?'ready':''}">${progress.completed.includes(i)?'Completed':i===4?'Ready':'To prepare'}</span></div>`).join('')}</div></section>`}
function resourcesPage(){return `${head()}<section class="card"><h3 class="card-title">Course resources</h3><div class="card-sub">Materials currently available in this portal preview.</div><div class="outline-list" style="margin-top:16px"><div class="outline-row"><span class="num">PDF</span><div style="flex:1"><b>CSP316 Plant Interference course outline and teaching note</b><small>Source document provided for this portal build · 2 pages</small></div><span class="state ready">Source material</span></div><div class="outline-row"><span class="num">10</span><div style="flex:1"><b>Course topic sequence</b><small>Ten topics from the CSP316 outline</small></div><span class="state ready">Available</span></div></div><div class="notice">Lecture notes, slides, datasets, videos and other study files can be added to each module when supplied.</div></section>`}
function helpPage(){return `${head()}<div class="cols"><section class="card"><h3 class="card-title">Learning support</h3><div class="card-sub">Guidance for using this course preview.</div><div class="todo"><div class="todo-icon">1</div><div><b>Choose a module</b><small>Use Course modules or the topic list in the left menu.</small></div></div><div class="todo"><div class="todo-icon">2</div><div><b>Study the material</b><small>Plant Interference has lesson text based on the supplied teaching note.</small></div></div><div class="todo"><div class="todo-icon">3</div><div><b>Check your understanding</b><small>Complete the quiz and review the feedback explanations.</small></div></div><div class="todo"><div class="todo-icon">4</div><div><b>Track completion</b><small>Mark a module complete to update your progress summary.</small></div></div></section><section class="card"><h3 class="card-title">About this preview</h3><p style="font-size:11px;line-height:1.7;color:var(--muted)">This is a standalone front-end prototype. It does not yet have student accounts, a shared course database, lecturer controls or a production deployment. Progress is saved only in your current browser.</p><p style="font-size:11px;line-height:1.7;color:var(--muted)">The supplied PDF includes a full lesson for Plant Interference; the other nine modules are currently structured from the course outline only.</p></section></div>`}
function render(){const root=document.getElementById('viewRoot');root.innerHTML=view==='dashboard'?dashboard():view==='course'?coursePage():view==='module'?modulePage():view==='progress'?progressPage():view==='resources'?resourcesPage():helpPage();}
function setTab(t){tab=t;render()}
function completeModule(i){if(!progress.completed.includes(i)){progress.completed.push(i);progress.completed.sort((a,b)=>a-b);save();toast('Module marked complete. Your progress is updated.')}else toast('This module is already marked complete.');render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)setView(b.dataset.view);const m=e.target.closest('[data-module]');if(m)openModule(Number(m.dataset.module))});
document.getElementById('menu').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
document.getElementById('searchInput').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();if(!q)return;const ix=topics.findIndex(t=>t.title.toLowerCase().includes(q));if(ix>=0){document.querySelectorAll('.module-card').forEach(c=>c.style.outline='');view='course';render();setTimeout(()=>{const c=document.querySelectorAll('.module-card')[ix];if(c){c.scrollIntoView({behavior:'smooth',block:'center'});c.style.outline='2px solid #5e946b'}},25)}});
document.addEventListener('submit',e=>{if(e.target.id!=='quizForm')return;e.preventDefault();let score=0,missing=[];questions.forEach((q,i)=>{const a=e.target.querySelector(`input[name="q${i}"]:checked`);if(!a)missing.push(i+1);else if(Number(a.value)===q.a)score++});if(missing.length){document.getElementById('quizFeedback').innerHTML=`<div class="quiz-result bad">Please answer all questions first. Still unanswered: ${missing.join(', ')}.</div>`;return}progress.best=Math.max(progress.best,score);save();const pass=score>=7;quizDone=true;document.getElementById('quizFeedback').innerHTML=`<div class="quiz-result ${pass?'good':'bad'}"><b>Score: ${score}/10 · ${pass?'Strong understanding':'Review and try again'}</b><div style="margin-top:5px">${pass?'You reached the 70% practice threshold. Read each explanation to consolidate your understanding.':'Review the lesson sections linked to the missed questions, then retry.'}</div></div>`+questions.map((q,i)=>`<div class="question"><b>${i+1}. ${esc(q.q)}</b><div style="font-size:11px;color:${Number(e.target.querySelector(`input[name="q${i}"]:checked`).value)===q.a?'#317148':'#97651b'}">Your answer: ${esc(q.opts[Number(e.target.querySelector(`input[name="q${i}"]:checked`).value)])}</div><div style="font-size:11px;color:#627168;margin-top:5px">Correct answer: <b>${esc(q.opts[q.a])}</b>. ${esc(q.why)}</div></div>`).join('');document.querySelector('.card').scrollIntoView({behavior:'smooth',block:'start'})});
renderMini();render();
</script></body></html>
